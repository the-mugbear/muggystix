# NetworkMapper Docker Compose Configuration
# Environment is configured via .env (copy from .env.example)
# Run ./scripts/deploy.sh for guided setup with auto-detected IP

# Log rotation for every service (review 2026-10-01 B11).  Docker's json-file
# driver keeps a container's whole stdout forever by default, and nginx writes
# an access-log line per request: on a long-lived host the logs alone filled
# the disk.  Each container now keeps at most LOG_MAX_FILE files of
# LOG_MAX_SIZE (5 × 20 MB by default).  scripts/collect-logs.sh reads the same
# logs, so raise these in .env if a diagnostics bundle needs to reach further
# back than they hold.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  db:
    # Pinned to the exact release in use (review 2026-10-01 B5) — `postgres:16`
    # moved to a new minor whenever the host happened to pull.  A tag, not a
    # digest.  POSTGRES_IMAGE in .env overrides it (an isolated host that has
    # another 16.x loaded); scripts/deploy.sh tags a matching local
    # `postgres:16` with this name instead of pulling.  The backup, restore
    # and round-trip scripts take the image from here, never a hardcoded tag.
    image: ${POSTGRES_IMAGE:-postgres:16.13}
    logging: *default-logging
    # v2.45.3 — flipped no → unless-stopped after a worker exit-255
    # went unnoticed for 24h (the worker silently stopped processing
    # the ingestion queue; restart: no meant Docker never recovered
    # it).  unless-stopped restarts a crashed container but still
    # honors an explicit `docker compose stop` — so a deliberate
    # dev shutdown isn't fought by the daemon.
    restart: unless-stopped
    # Stock postgres:16 ships max_connections=100 and shared_buffers=128MB.
    # 100 is below this stack's worst-case connection draw (4 uvicorn
    # workers + the ingestion worker, each with its own SQLAlchemy pool),
    # so the default here is raised to 120.  Memory tunables are
    # env-overridable and default conservatively (safe on a ~2-4GB host)
    # — scale PG_SHARED_BUFFERS / PG_EFFECTIVE_CACHE_SIZE to host RAM in
    # .env.  Change them on a signal, not a guess (.env.example has the
    # queries): temp_bytes climbing -> PG_WORK_MEM; blks_read far above
    # blks_hit on a warm instance -> PG_SHARED_BUFFERS.
    # The entrypoint still runs initdb + the SSL init script; only
    # the final `postgres` invocation is overridden.
    #
    # Measurement (review 2026-10-01): every statement slower than
    # PG_LOG_MIN_DURATION_MS is written to the db log (collect-logs.sh
    # bundles it, scrubbed), and pg_stat_statements is loaded so per-statement
    # totals can be read once the extension exists in the database.  Loading
    # the library needs this server flag — it cannot be turned on later
    # without a restart — and costs nothing until the extension is created.
    command:
      - "postgres"
      - "-c"
      - "max_connections=${PG_MAX_CONNECTIONS:-120}"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}"
      - "-c"
      - "work_mem=${PG_WORK_MEM:-8MB}"
      - "-c"
      - "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}"
      - "-c"
      - "log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-500}"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-networkMapper}
      POSTGRES_USER: ${POSTGRES_USER:-nmapuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nmappass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nmapuser} -d ${POSTGRES_DB:-networkMapper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Database port NOT exposed to host by default for security
    # Only accessible via Docker network from backend
    # Uncomment for local development database access:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ssl/certs:/certs:ro
      - ./scripts/postgres/init-ssl.sh:/docker-entrypoint-initdb.d/10-init-ssl.sh:ro
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      # v2.384.0 — the Dockerfile's LAST stage is the report worker (with
      # Quarto); the API and ingestion worker name the plain image.
      target: production
      args:
        CACHE_BUST: ${CACHE_BUST:-}
        # Passed only when set in .env / the environment; otherwise the
        # Dockerfile's pinned defaults apply (one place to read the pin).
        # INSTALL_DEV=false builds without pytest/ruff — and then the suite
        # cannot run from this image (see backend/requirements-dev.txt).
        PYTHON_IMAGE:
        INSTALL_DEV:
    logging: *default-logging
    # v2.45.3 — flipped no → unless-stopped after a worker exit-255
    # went unnoticed for 24h (the worker silently stopped processing
    # the ingestion queue; restart: no meant Docker never recovered
    # it).  unless-stopped restarts a crashed container but still
    # honors an explicit `docker compose stop` — so a deliberate
    # dev shutdown isn't fought by the daemon.
    restart: unless-stopped
    # The app answers /health only after `alembic upgrade head` finished, and
    # a data migration on a large project runs for minutes.  With the image's
    # old 60 s start period the container went "unhealthy" ~150 s in, the
    # frontend's `depends_on: service_healthy` failed, and `up` reported a
    # failed deploy in the middle of a healthy migration (review 2026-10-01
    # R31).  Failing probes do not count during the start period and the first
    # passing one ends it, so a fast boot is unaffected.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: ${BACKEND_HEALTH_START_PERIOD:-15m}
      retries: 3
    # v2.63.0 — explicit memory cap.  Uploads stream chunk-by-chunk
    # to disk so the body never sits fully in RAM; this cap covers
    # the long tail (UVICORN_WORKERS × per-worker state).  Override
    # via BACKEND_MEM_LIMIT in .env.
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    # Backend is only accessible via the nginx reverse proxy on the Docker network.
    # Uncomment the line below for direct backend access during debugging:
    # ports:
    #   - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # NB: BACKEND_PORT does nothing while this block is commented out — the
    # port is not published at all. Uncomment to expose it for debugging.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nmapuser}:${POSTGRES_PASSWORD:-nmappass}@db:5432/${POSTGRES_DB:-networkMapper}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-prefer}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,https://localhost:3000}
      APP_VERSION: ${APP_VERSION:-2.449.1}
      FRONTEND_VERSION: ${FRONTEND_VERSION:-5.328.1}
      PLATFORM_VERSION_FILE: /app/platform_version.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      # NOT read-only: pytest caches its rewritten test modules in
      # tests/__pycache__ through this mount (a read-only one makes every
      # suite run rewrite all of them again), and nothing in the running app
      # reads or writes it.
      - ./backend/tests:/app/tests
      # Read-only: nothing writes through these.  The seed and repair scripts
      # run from /app/scripts but write to the database and /app/uploads.
      - ./backend/pytest.ini:/app/pytest.ini:ro
      - ./scripts:/app/scripts:ro
      - ./platform_version.json:/app/platform_version.json:ro
      # The agent guide served at /api/v1/agents-guide (renamed from a root
      # AGENTS.md in v2.427.1: coding agents load a root AGENTS.md as repo rules).
      - ./documentation/AGENT_GUIDE.md:/app/AGENT_GUIDE.md:ro
      # Public half of the deployment's TLS certificate, so the API can hand it
      # to operators for inspection and the fingerprint check (see
      # /references/tls-certificate); clients trust it via the local root CA.
      # Read-only, and the private key is deliberately NOT mounted here.
      - ./ssl/certs/networkmapper.crt:/certs/networkmapper.crt:ro
      # SBOM endpoint reads the frontend's resolved lockfile.  Read-only
      # mount keeps the source of truth in frontend/ — the SBOM endpoint
      # in main.py reflects whatever the deployed build resolved to.
      - ./frontend/package-lock.json:/app/frontend-package-lock.json:ro
      # v2.384.0 — the client-report templates (listed and fingerprinted by
      # the API; rendered by the report worker).  Read-only: templates come
      # from the repository, edited there, picked up without a rebuild.
      - ./report-templates:/app/report-templates:ro
      # Manual test fixtures (v2.45.1) — read-only.  Used by the
      # parametrized dispatcher test in test_artifacts_manual_dispatcher.py
      # to verify the correct parser engages for every supported
      # upload format.  Mounted at the same relative path that the
      # test resolves via ``Path(__file__).resolve().parents[1] / "artifacts"
      # / "manual"`` (one level above /app/tests = /app, then artifacts/).
      - ./artifacts:/app/artifacts:ro
    networks:
      - app-network

  worker:
    build:
      context: ./backend
      target: production
      args:
        CACHE_BUST: ${CACHE_BUST:-}
        PYTHON_IMAGE:
        INSTALL_DEV:
    logging: *default-logging
    # v2.45.3 — flipped no → unless-stopped after a worker exit-255
    # went unnoticed for 24h (the worker silently stopped processing
    # the ingestion queue; restart: no meant Docker never recovered
    # it).  unless-stopped restarts a crashed container but still
    # honors an explicit `docker compose stop` — so a deliberate
    # dev shutdown isn't fought by the daemon.
    restart: unless-stopped
    # v2.63.0 — explicit memory cap.  Sized for a 2 GB Nessus parse
    # under NESSUS_COMMIT_BATCH_SIZE=50 (peak typically 500 MB-1 GB);
    # 4 GB leaves headroom and prevents a runaway from OOM-ing the
    # host.  Bump WORKER_MEM_LIMIT in .env if MAX_FILE_SIZE > 2 GB.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    # Override the default Uvicorn CMD — run the ingestion worker instead.
    # `exec` so python is PID 1 and RECEIVES SIGTERM (a shell parent does not
    # forward it); the worker then hands an in-progress job back to the queue
    # at its next progress update, inside the grace period below.  Without
    # both, a rebuild SIGKILLed a parse mid-way after 10 s and the job sat
    # 'processing' for the reaper's 45 minutes (review 2026-09-23 R3).
    command: ["sh", "-c", "mkdir -p /app/uploads/ingestion_queue 2>/dev/null; exec python -m app.worker"]
    stop_grace_period: 2m
    # The worker doesn't run an HTTP server, so override the Dockerfile's
    # curl-based healthcheck.  v2.194.0 — heartbeat-freshness instead of a
    # /proc grep: the worker rewrites .worker_heartbeat each loop cycle, so a
    # wedged or crashed-but-process-alive loop (which /proc grep read as
    # healthy — the 24h-silent-worker failure mode) lets it go stale and flips
    # unhealthy.  A live process is implied (a dead one can't refresh it).
    # WORKER_HEARTBEAT_TIMEOUT (default 180s) tolerates a long single job;
    # raise it if you ingest very large files.  Heartbeat path is container-
    # local (/tmp), writable by the worker's non-root user, and matches the
    # worker's WORKER_HEARTBEAT_PATH default.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p=os.getenv('WORKER_HEARTBEAT_PATH','/tmp/bluestick_worker_heartbeat'); sys.exit(0 if os.path.exists(p) and (time.time()-os.path.getmtime(p)) < float(os.getenv('WORKER_HEARTBEAT_TIMEOUT','180')) else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nmapuser}:${POSTGRES_PASSWORD:-nmappass}@db:5432/${POSTGRES_DB:-networkMapper}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-prefer}
      APP_VERSION: ${APP_VERSION:-2.449.1}
      PLATFORM_VERSION_FILE: /app/platform_version.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./platform_version.json:/app/platform_version.json:ro
    networks:
      - app-network

  # v2.196.0 — dedicated worker for async report generation (PDF/JSON/zip
  # bundles).  Isolated from ingestion so a heavy WeasyPrint render never blocks
  # a scan parse (and vice versa).  Same image, different command.  Writes
  # artifacts to the shared uploads volume so the backend's download endpoint can
  # stream them.
  report-worker:
    build:
      context: ./backend
      # v2.384.0 — the production image plus a pinned Quarto (client reports).
      target: report-worker
      args:
        CACHE_BUST: ${CACHE_BUST:-}
        PYTHON_IMAGE:
        # The base of the stage that downloads Quarto (only this target
        # builds it); passed only when set, like PYTHON_IMAGE.
        DEBIAN_IMAGE:
        INSTALL_DEV:
    logging: *default-logging
    restart: unless-stopped
    # Sized for an in-memory PDF/zip build of a capped report; bump
    # REPORT_WORKER_MEM_LIMIT in .env if you raise REPORT_MAX_HOSTS.
    mem_limit: ${REPORT_WORKER_MEM_LIMIT:-2g}
    # `exec`: python is PID 1 and receives SIGTERM (see the worker above).
    command: ["sh", "-c", "mkdir -p /app/uploads/report_artifacts /app/uploads/client_reports 2>/dev/null; exec python -m app.report_worker"]
    # A client-report render may run for REPORT_RENDER_TIMEOUT_SECONDS (300 s
    # by default) per format.  Docker's default 10 s grace SIGKILLed a render
    # on every rebuild, leaving the job 'processing' until the reaper's
    # timeout (review 2026-10-01 N7).  Six minutes = one render timeout plus a
    # margin; raise REPORT_WORKER_STOP_GRACE with the render timeout.
    stop_grace_period: ${REPORT_WORKER_STOP_GRACE:-6m}
    # Same heartbeat-freshness healthcheck as the ingestion worker (v2.194.0):
    # the loop rewrites the file each cycle, so a wedged render goes stale ->
    # unhealthy.  Reuses WORKER_HEARTBEAT_TIMEOUT; own heartbeat path.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,time,sys; p=os.getenv('REPORT_WORKER_HEARTBEAT_PATH','/tmp/bluestick_report_worker_heartbeat'); sys.exit(0 if os.path.exists(p) and (time.time()-os.path.getmtime(p)) < float(os.getenv('WORKER_HEARTBEAT_TIMEOUT','180')) else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nmapuser}:${POSTGRES_PASSWORD:-nmappass}@db:5432/${POSTGRES_DB:-networkMapper}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-prefer}
      APP_VERSION: ${APP_VERSION:-2.449.1}
      PLATFORM_VERSION_FILE: /app/platform_version.json
      # One sequential loop — a small pool protects the Postgres
      # max_connections budget (4 API workers + ingestion worker + this).
      DB_POOL_SIZE: ${REPORT_WORKER_DB_POOL_SIZE:-3}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./platform_version.json:/app/platform_version.json:ro
      - ./report-templates:/app/report-templates:ro
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        CACHE_BUST: ${CACHE_BUST:-}
        REACT_APP_API_URL: ${REACT_APP_API_URL:-https://localhost}
        # Keep this fallback in sync with the APP_VERSION defaults above
        # (lines 49 + 87) and with platform_version.json's "backend".
        BACKEND_VERSION: ${APP_VERSION:-2.449.1}
        # CR4-8 — the build context is just frontend/, so platform_version.json
        # isn't visible during the Docker build; pass the frontend version in
        # so generate-build-info.js stamps the right version (shown under About BlueStick).  Keep in
        # sync with platform_version.json's "frontend".
        FRONTEND_VERSION: ${FRONTEND_VERSION:-5.328.1}
        # Shown under About BlueStick; deploy.sh exports it from `git rev-parse`.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        # Passed only when set; the Dockerfile holds the pinned defaults.
        NODE_IMAGE:
        NGINX_IMAGE:
    logging: *default-logging
    # v2.45.3 — flipped no → unless-stopped after a worker exit-255
    # went unnoticed for 24h (the worker silently stopped processing
    # the ingestion queue; restart: no meant Docker never recovered
    # it).  unless-stopped restarts a crashed container but still
    # honors an explicit `docker compose stop` — so a deliberate
    # dev shutdown isn't fought by the daemon.
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_INTERNAL_PORT:-3000}"
      - "${HTTPS_PORT:-443}:443"
    # No env_file / environment here, deliberately. The production stage is
    # stock nginx with no entrypoint and no envsubst, so nothing in this
    # container reads an env var: REACT_APP_API_URL is inlined into the JS
    # bundle at BUILD time (see the build arg above), which is why changing it
    # requires `--build` and not just a restart. `env_file: .env` was also
    # injecting SECRET_KEY, POSTGRES_PASSWORD and CREDENTIAL_ENCRYPTION_KEY
    # into a container that has no use for any of them.
    volumes:
      - ${NGINX_CONFIG:-./ssl-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/certs/networkmapper.crt:/etc/ssl/certs/networkmapper.crt:ro
      - ./ssl/certs/networkmapper.key:/etc/ssl/private/networkmapper.key:ro
    depends_on:
      backend:
        # Wait for the backend to be *healthy* (DB reachable + migrations run +
        # /health returning 200), not merely started, so nginx doesn't serve
        # 502 white-screens during backend boot. Pairs with the DB-backed
        # /health probe in app/main.py.
        condition: service_healthy
    networks:
      - app-network

# let docker manage storage, typically at /var/lib/docker/volumes/
volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
